# dsh-daemon bundle patch.
#
# The daemon profile is management-only: it owns install/start/stop/restart/
# status/logs/uninstall. Serving stays in the untouched `web` profile — the
# systemd unit's ExecStart is `dsh web --no-open` (plus any baked --host/--port).
#
# The same bundle is also installed in the `web` profile so Settings can show
# the Daemon page. There the host half registers authenticated /api/dsh-daemon
# routes while the command-line parser stays dormant (src/index.js checks the
# profile name), so it never claims the web app's command line.
- insert:
    - id: daemon
      name: '@gitsang/dsh-daemon'
